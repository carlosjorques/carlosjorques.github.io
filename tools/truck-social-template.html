<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .card { position: relative; width: 1200px; height: 630px; overflow: hidden; padding: 52px 72px 42px; background: #fff; color: #1d2124; font-family: "Instrument Sans", sans-serif; }
    .mast { display: flex; align-items: center; justify-content: space-between; font-size: 19px; line-height: 1.3; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 25px; font-weight: 600; letter-spacing: -.025em; }
    .signal { display: inline-block; flex: none; width: 13px; height: 13px; margin: 4px; border-radius: 50%; background: #bfff03; box-shadow: 0 0 0 4px rgba(191, 255, 3, .3); }
    .meta { color: #6b7177; }
    h1 { margin: 105px 0 0; font-size: {{TITLE_SIZE}}px; line-height: 1.075; letter-spacing: -.045em; font-weight: 600; }
    .evidence { position: absolute; left: 72px; right: 72px; bottom: 91px; display: flex; gap: 48px; align-items: center; border-top: 1px solid #e6e6e1; padding-top: 26px; }
    .evidence strong { flex: none; font-size: {{VALUE_SIZE}}px; line-height: 1; letter-spacing: -.045em; font-weight: 600; }
    .mark { background: linear-gradient(transparent 62%, rgba(191, 255, 3, .64) 62%, rgba(191, 255, 3, .64) 93%, transparent 93%); }
    .evidence p { margin: 0; font-family: "Source Serif 4", Georgia, serif; font-size: 26px; line-height: 1.3; }
    .levels { flex: none; display: flex; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .levels li { width: 46px; height: 60px; display: grid; place-content: center; justify-items: center; gap: 3px; border: 1.5px solid #1d2124; border-radius: 7px; font-size: 21px; font-weight: 600; line-height: 1; }
    .levels small { font-size: 12px; letter-spacing: .02em; }
    .levels .now { background: #bfff03; border-color: #bfff03; }
    .levels .locked { border: 1.5px dashed #b9bcb6; color: #9a9fa4; }
    .footer { position: absolute; left: 72px; right: 72px; bottom: 40px; display: flex; align-items: center; justify-content: space-between; font-size: 17px; color: #6b7177; }
    .domain { color: #1d2124; font-weight: 500; }
  </style>
</head>
<body>
  <section class="card" aria-label="Social cover">
    <header class="mast"><div class="brand"><span class="signal" aria-hidden="true"></span>Carlos Jorques</div><div class="meta">{{PART}}</div></header>
    <h1>{{TITLE}}</h1>
    <div class="evidence">{{EVIDENCE}}<p>{{DETAIL}}</p></div>
    <footer class="footer"><span>{{FOOTER}}</span><span class="domain">carlosjorques.com</span></footer>
  </section>
</body>
</html>
