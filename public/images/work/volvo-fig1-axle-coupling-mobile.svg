<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1041" viewBox="0 0 360 1041" font-family="Calibri, Arial, sans-serif">
  <defs><marker id="a4d4d4d" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4d4d4d"/></marker></defs>
  <rect width="360" height="1041" fill="#ffffff"/>
  <text x="16" y="34" font-size="17" font-weight="bold" fill="#1a1a1a">(a) Two controllers, one motion</text>
  <text x="120" y="66" font-size="13" fill="#1f4f78">measured speed</text>
  <rect x="40" y="100" width="132" height="86" fill="#eeeeee"/>
  <text x="52" y="130" font-size="14" font-weight="bold" fill="#1a1a1a">PI controller</text>
  <text x="52" y="153" font-size="14" fill="#1a1a1a">axle 1</text>
  <text x="52" y="172" font-size="13" fill="#4d4d4d">Own speed error</text>
  <rect x="188" y="100" width="132" height="86" fill="#eeeeee"/>
  <text x="200" y="130" font-size="14" font-weight="bold" fill="#1a1a1a">PI controller</text>
  <text x="200" y="153" font-size="14" fill="#1a1a1a">axle 2</text>
  <text x="200" y="172" font-size="13" fill="#4d4d4d">Own speed error</text>
  <path d="M106 186V232" fill="none" stroke="#4d4d4d" stroke-width="2" marker-end="url(#a4d4d4d)"/>
  <text x="114" y="214" font-size="12" fill="#4d4d4d">torque 1</text>
  <path d="M254 186V232" fill="none" stroke="#4d4d4d" stroke-width="2" marker-end="url(#a4d4d4d)"/>
  <text x="262" y="214" font-size="12" fill="#4d4d4d">torque 2</text>
  <rect x="40" y="232" width="280" height="69" fill="#f2e3d4"/>
  <text x="52" y="264" font-size="16" font-weight="bold" fill="#1a1a1a">Hauler body: one speed</text>
  <text x="52" y="287" font-size="14" fill="#4d4d4d">Two electric axles, one shared motion</text>
  <path d="M320 266H348V74H106V100" fill="none" stroke="#4d4d4d" stroke-width="2" marker-end="url(#a4d4d4d)"/>
  <path d="M254 74V100" fill="none" stroke="#4d4d4d" stroke-width="2" marker-end="url(#a4d4d4d)"/>
  <circle cx="254" cy="74" r="3.5" fill="#4d4d4d"/>
  <text x="16" y="330" font-size="14" fill="#4d4d4d">Slope, grip, mud and load disturb both axles.</text>
  <text x="16" y="369" font-size="16" font-weight="bold" fill="#1f4f78">Why the hauler trembles</text>
  <text x="16" y="397" font-size="14" fill="#1a1a1a">1. Axle 1 sees low speed and adds torque.</text>
  <text x="16" y="425" font-size="14" fill="#1a1a1a">2. Both axles speed up; axle 2 cuts torque.</text>
  <text x="16" y="453" font-size="14" fill="#1a1a1a">3. The hauler slows, so axle 1 adds torque.</text>
  <text x="16" y="481" font-size="14" fill="#1a1a1a">4. The cycle repeats.</text>
  <text x="16" y="529" font-size="17" font-weight="bold" fill="#1a1a1a">(b) Speed against time, illustrative</text>
  <rect x="41" y="597.2" width="303" height="22.1" fill="#d6e3f0" opacity="0.6"/>
