<text x="565" y="125" text-anchor="start" font-size="12.5px" font-weight="normal" fill="#1f4f78">measured</text>
<text x="565" y="140" text-anchor="start" font-size="12.5px" font-weight="normal" fill="#1f4f78">speed</text>
<circle cx="560" cy="205" r="5" fill="#1f4f78"/>
<text x="40" y="420" text-anchor="start" font-size="13.5px" font-weight="normal" fill="#b36b12">1  Controller 1 sees the hauler too slow and adds torque.</text>
<text x="40" y="442" text-anchor="start" font-size="13.5px" font-weight="normal" fill="#b36b12">2  The body speeds up, so controller 2 sees it too fast.</text>
<text x="40" y="464" text-anchor="start" font-size="13.5px" font-weight="normal" fill="#b36b12">3  Controller 2 cuts torque, and the body slows down.</text>
<text x="40" y="486" text-anchor="start" font-size="13.5px" font-weight="normal" fill="#b36b12">4  Controller 1 adds torque again, and the cycle repeats.</text>
<text x="40" y="514" text-anchor="start" font-size="13px" font-weight="normal" fill="#4d4d4d">Each controller was tuned as if it moved the hauler alone.</text>
<text x="615" y="30" text-anchor="start" font-size="16px" font-weight="bold" fill="#1a1a1a">(b) Speed against time, illustrative</text>
