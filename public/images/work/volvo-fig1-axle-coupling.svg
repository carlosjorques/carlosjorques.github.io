<text x="162" y="160" text-anchor="start" font-size="12.5px" font-weight="normal" fill="#4d4d4d">torque 1</text>
<polyline fill="none" stroke="#4d4d4d" stroke-width="1.5" points="425.0,116.0 425.0,287.0" marker-end="url(#ah)"/>
<text x="432" y="160" text-anchor="start" font-size="12.5px" font-weight="normal" fill="#4d4d4d">torque 2</text>
