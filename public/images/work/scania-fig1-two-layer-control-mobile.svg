  <rect x="40" y="349" width="280" height="110" fill="#f2e3d4"/>
  <text x="52" y="381" font-size="16" font-weight="bold" fill="#1a1a1a">Lower layer: control allocator</text>
  <text x="52" y="404" font-size="14" fill="#4d4d4d">Picks the pumps, fans and heaters</text>
  <text x="52" y="425" font-size="14" fill="#4d4d4d">that meet the demand with the</text>
  <text x="52" y="445" font-size="14" fill="#4d4d4d">least electrical power.</text>
