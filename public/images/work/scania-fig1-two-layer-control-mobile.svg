  <circle cx="254" cy="143" r="3.5" fill="#4d4d4d"/>
  <rect x="40" y="171" width="132" height="142" fill="#f2e3d4"/>
  <text x="52" y="202" font-size="15" font-weight="bold" fill="#1a1a1a">Upper layer:</text>
