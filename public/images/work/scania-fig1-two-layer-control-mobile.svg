<svg xmlns="http://www.w3.org/2000/svg" width="360" height="661" viewBox="0 0 360 661" font-family="Calibri, Arial, sans-serif">
  <defs><marker id="a4d4d4d" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4d4d4d"/></marker></defs>
  <rect width="360" height="661" fill="#ffffff"/>
  <rect x="40" y="20" width="132" height="105" fill="#eeeeee"/>
  <text x="52" y="51" font-size="15" font-weight="bold" fill="#1a1a1a">Route forecast</text>
