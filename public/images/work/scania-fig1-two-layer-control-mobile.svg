  <text x="52" y="92" font-size="13" fill="#4d4d4d">weather and next</text>
  <text x="52" y="111" font-size="13" fill="#4d4d4d">charging stop</text>
  <rect x="188" y="20" width="132" height="105" fill="#eeeeee"/>
  <text x="200" y="51" font-size="15" font-weight="bold" fill="#1a1a1a">Measurements</text>
  <text x="200" y="73" font-size="13" fill="#4d4d4d">Temperatures,</text>
  <text x="200" y="92" font-size="13" fill="#4d4d4d">pressures and</text>
  <text x="200" y="111" font-size="13" fill="#4d4d4d">battery state</text>
