  <text x="52" y="243" font-size="13" fill="#4d4d4d">Plans the heating or</text>
  <text x="52" y="261" font-size="13" fill="#4d4d4d">cooling each</text>
  <text x="52" y="280" font-size="13" fill="#4d4d4d">component needs</text>
  <text x="52" y="299" font-size="13" fill="#4d4d4d">along the route.</text>
  <rect x="188" y="171" width="132" height="142" fill="#eeeeee"/>
  <text x="200" y="202" font-size="15" font-weight="bold" fill="#1a1a1a">Fall-back mode</text>
  <text x="200" y="224" font-size="13" fill="#4d4d4d">Without route data,</text>
  <text x="200" y="243" font-size="13" fill="#4d4d4d">temperature</text>
  <text x="200" y="262" font-size="13" fill="#4d4d4d">set-points replace</text>
  <text x="200" y="280" font-size="13" fill="#4d4d4d">the plan.</text>
