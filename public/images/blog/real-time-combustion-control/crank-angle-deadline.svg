<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Crank-angle timing deadline</title>
  <desc id="desc">Timeline showing pilot injection, observation window, estimation, control computation, and main injection command deadline.</desc>
  <rect width="1200" height="520" fill="#f7f2ec"/>
  <path d="M100 292h1000" stroke="#161616" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#9a4d4d" stroke-width="4" stroke-linecap="round">
    <path d="M190 212v160"/>
    <path d="M420 212v160"/>
    <path d="M690 212v160"/>
    <path d="M940 212v160"/>
  </g>
  <g fill="#faf8f7" stroke="#161616" stroke-opacity=".25" stroke-width="2">
    <rect x="126" y="120" width="128" height="68" rx="10"/>
    <rect x="330" y="120" width="180" height="68" rx="10"/>
    <rect x="584" y="120" width="212" height="68" rx="10"/>
    <rect x="840" y="120" width="200" height="68" rx="10"/>
  </g>
  <g fill="#161616" font-family="Inter, Arial, sans-serif" text-anchor="middle" font-size="20" font-weight="700">
    <text x="190" y="148">Pilot</text><text x="190" y="172">injection</text>
    <text x="420" y="148">Pressure</text><text x="420" y="172">observation</text>
    <text x="690" y="148">Estimate and</text><text x="690" y="172">predict</text>
    <text x="940" y="148">Main command</text><text x="940" y="172">deadline</text>
  </g>
  <path d="M230 292c70-120 122-120 176 0s108 130 174 0 116-132 190 0" fill="none" stroke="#9a4d4d" stroke-width="5" stroke-linecap="round"/>
  <path d="M190 404h750" stroke="#161616" stroke-opacity=".3" stroke-width="3"/>
  <text x="565" y="438" text-anchor="middle" fill="#666" font-family="JetBrains Mono, Consolas, monospace" font-size="18">crank-angle-resolved control window</text>
</svg>
