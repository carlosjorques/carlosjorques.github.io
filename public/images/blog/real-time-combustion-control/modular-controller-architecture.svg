  <text x="600" y="286" text-anchor="middle" fill="#efe6d8" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">machine</text>
  <g fill="#241d18" stroke="#d8b08c" stroke-width="3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">
