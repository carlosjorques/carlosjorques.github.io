<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Offline versus real-time combustion analysis</title>
  <desc id="desc">Split comparison between offline analysis with full-cycle data and real-time embedded control with partial information and deadlines.</desc>
  <rect width="1200" height="520" fill="#f7f2ec"/>
  <path d="M600 70v380" stroke="#161616" stroke-opacity=".16" stroke-width="3"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="300" y="96" text-anchor="middle" fill="#161616" font-size="34" font-weight="700">Offline analysis</text>
    <text x="900" y="96" text-anchor="middle" fill="#161616" font-size="34" font-weight="700">Real-time execution</text>
  </g>
  <g transform="translate(110 154)">
    <rect width="380" height="220" rx="16" fill="#faf8f7" stroke="#161616" stroke-opacity=".25" stroke-width="2"/>
    <path d="M46 142c48-92 90-98 126-18s78 94 126 18" fill="none" stroke="#9a4d4d" stroke-width="5" stroke-linecap="round"/>
    <path d="M46 170h290" stroke="#161616" stroke-opacity=".25" stroke-width="3"/>
    <g fill="#666" font-family="JetBrains Mono, Consolas, monospace" font-size="17">
      <text x="48" y="52">full-cycle data</text>
      <text x="48" y="82">high precision</text>
      <text x="48" y="112">post-event evaluation</text>
    </g>
  </g>
  <g transform="translate(710 154)">
    <rect width="380" height="220" rx="16" fill="#241d18" stroke="#9a4d4d" stroke-width="2"/>
    <path d="M46 142c42-80 84-88 126-14" fill="none" stroke="#f0b36a" stroke-width="5" stroke-linecap="round"/>
    <path d="M250 70v132" stroke="#efe6d8" stroke-width="4" stroke-dasharray="8 8"/>
    <path d="M46 170h290" stroke="#efe6d8" stroke-opacity=".28" stroke-width="3"/>
    <g fill="#efe6d8" font-family="JetBrains Mono, Consolas, monospace" font-size="17">
      <text x="48" y="52">partial information</text>
      <text x="48" y="82">fixed resources</text>
      <text x="48" y="112">deadline before command</text>
    </g>
  </g>
  <text x="600" y="438" text-anchor="middle" fill="#666" font-family="JetBrains Mono, Consolas, monospace" font-size="18">Placeholder comparison graphic - replace with final custom or thesis-derived figure.</text>
</svg>
