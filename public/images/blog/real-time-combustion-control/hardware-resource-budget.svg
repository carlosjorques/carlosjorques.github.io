<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Hardware resource budgeting</title>
  <desc id="desc">Stacked resource budget illustration for logic, memory, multipliers, data paths, parallel modules, and scheduling margin.</desc>
  <rect width="1200" height="520" fill="#f7f2ec"/>
  <g transform="translate(110 120)">
    <rect x="0" y="0" width="980" height="90" rx="12" fill="#faf8f7" stroke="#161616" stroke-opacity=".25" stroke-width="2"/>
    <rect x="0" y="0" width="190" height="90" rx="12" fill="#241d18"/>
    <rect x="190" y="0" width="160" height="90" fill="#7d4a3f"/>
    <rect x="350" y="0" width="130" height="90" fill="#9a4d4d"/>
    <rect x="480" y="0" width="170" height="90" fill="#b86b4b"/>
    <rect x="650" y="0" width="180" height="90" fill="#d8b08c"/>
    <rect x="830" y="0" width="150" height="90" rx="12" fill="#efe6d8"/>
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="17" font-weight="700">
      <text x="95" y="132" text-anchor="middle" fill="#161616">logic</text>
      <text x="270" y="132" text-anchor="middle" fill="#161616">memory</text>
      <text x="415" y="132" text-anchor="middle" fill="#161616">DSP</text>
      <text x="565" y="132" text-anchor="middle" fill="#161616">fixed-point</text>
      <text x="740" y="132" text-anchor="middle" fill="#161616">parallel modules</text>
      <text x="905" y="132" text-anchor="middle" fill="#161616">margin</text>
    </g>
  </g>
  <g transform="translate(170 330)" font-family="Inter, Arial, sans-serif" fill="#161616">
    <text x="0" y="0" font-size="28" font-weight="700">Real-time feasibility has to be measured.</text>
    <text x="0" y="42" font-size="22" fill="#666">Timing, resource usage, numerical representation, and module scheduling all shape the deployable algorithm.</text>
  </g>
</svg>
