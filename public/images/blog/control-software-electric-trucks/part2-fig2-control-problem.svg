<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="400" viewBox="0 0 1050 400" font-family="Calibri, Arial, Helvetica, sans-serif">
  <!-- DRAFT v2: Part 2, Figure 2. Thermal control problem, restyled: orange = software, rest neutral. -->
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4d4d4d"/></marker>
  </defs>
  <rect width="1050" height="400" fill="#ffffff"/>

  <!-- Disturbances -->
  <rect x="600" y="20" width="280" height="70" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="740" y="44" text-anchor="middle" font-size="14px" font-weight="bold" fill="#1a1a1a">Disturbances (d)</text>
  <text x="740" y="62" text-anchor="middle" font-size="12.5px" fill="#4d4d4d">ambient temperature, vehicle speed,</text>
  <text x="740" y="78" text-anchor="middle" font-size="12.5px" fill="#4d4d4d">propulsion and charging heat</text>
  <line x1="740" y1="90" x2="740" y2="148" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ak)"/>

  <!-- Thermal system -->
  <rect x="600" y="150" width="280" height="120" fill="#eeeeee"/>
  <text x="740" y="186" text-anchor="middle" font-size="14px" font-weight="bold" fill="#1a1a1a">Thermal system</text>
  <text x="740" y="206" text-anchor="middle" font-size="12.5px" fill="#4d4d4d">states (x): cell, coolant, power-electronics</text>
  <text x="740" y="222" text-anchor="middle" font-size="12.5px" fill="#4d4d4d">and motor temperatures, refrigerant</text>
  <text x="740" y="238" text-anchor="middle" font-size="12.5px" fill="#4d4d4d">pressures, cab climate</text>

  <!-- Controller (software) -->
  <rect x="220" y="150" width="250" height="120" fill="#f2e3d4" stroke="#d98c2b" stroke-width="1.5"/>
  <text x="345" y="186" text-anchor="middle" font-size="14px" font-weight="bold" fill="#1a1a1a">Controller</text>
  <text x="345" y="206" text-anchor="middle" font-size="12.5px" fill="#4d4d4d">objective: minimum energy</text>
  <text x="345" y="222" text-anchor="middle" font-size="12.5px" fill="#4d4d4d">constraints: temperature, pressure</text>
  <text x="345" y="238" text-anchor="middle" font-size="12.5px" fill="#4d4d4d">and actuator limits</text>

  <!-- Inputs u -->
  <line x1="470" y1="210" x2="598" y2="210" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ak)"/>
  <text x="535" y="198" text-anchor="middle" font-size="14px" font-weight="bold" fill="#1a1a1a">Inputs (u)</text>
  <text x="535" y="232" text-anchor="middle" font-size="12.5px" fill="#4d4d4d">pumps, valves,</text>
  <text x="535" y="248" text-anchor="middle" font-size="12.5px" fill="#4d4d4d">compressor, fans,</text>
  <text x="535" y="264" text-anchor="middle" font-size="12.5px" fill="#4d4d4d">heaters, mode</text>

  <!-- Forecast (predictive path) -->
  <rect x="20" y="165" width="150" height="90" fill="#ffffff" stroke="#4d4d4d" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="95" y="190" text-anchor="middle" font-size="14px" font-weight="bold" fill="#1a1a1a">Forecast</text>
  <text x="95" y="208" text-anchor="middle" font-size="12.5px" fill="#4d4d4d">route and gradient,</text>
  <text x="95" y="224" text-anchor="middle" font-size="12.5px" fill="#4d4d4d">speed, ambient,</text>
  <text x="95" y="240" text-anchor="middle" font-size="12.5px" fill="#4d4d4d">next charging stop</text>
  <g fill="none" stroke="#4d4d4d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ag)">
    <line x1="170" y1="210" x2="218" y2="210"/>
    <polyline points="600,55 95,55 95,163"/>
  </g>
  <text x="330" y="47" text-anchor="middle" font-size="12.5px" font-style="italic" fill="#4d4d4d">predicted disturbances</text>
  <text x="95" y="284" text-anchor="middle" font-size="12.5px" font-style="italic" fill="#4d4d4d">used by</text>
  <text x="95" y="300" text-anchor="middle" font-size="12.5px" font-style="italic" fill="#4d4d4d">predictive control</text>

  <!-- Feedback path -->
  <g fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ak)">
    <polyline points="880,210 950,210 950,345 702,345"/>
    <polyline points="460,345 345,345 345,272"/>
  </g>
  <rect x="460" y="320" width="240" height="50" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="580" y="350" text-anchor="middle" font-size="14px" font-weight="bold" fill="#1a1a1a">Sensors and state estimator</text>
  <text x="335" y="310" text-anchor="end" font-size="12.5px" fill="#4d4d4d">measured and estimated states</text>
  <text x="960" y="280" font-size="12.5px" fill="#4d4d4d">measured</text>
  <text x="960" y="296" font-size="12.5px" fill="#4d4d4d">outputs</text>

  <!-- Watermark -->
  <text x="1030" y="390" text-anchor="end" font-size="11px" font-weight="bold" fill="#999999">carlosjorques.com</text>
</svg>
