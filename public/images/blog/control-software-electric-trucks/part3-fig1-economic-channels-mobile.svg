<svg xmlns="http://www.w3.org/2000/svg" width="360" height="868" viewBox="0 0 360 868" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Value channels of an electric-truck efficiency gain</title>
  <desc id="description">A 3% efficiency gain acts through electricity and charging time for any truck in service, worth 1.2 times the electricity saved, and through battery cost and payload when specified, worth 1.8–2.5 times. Cost per tonne-kilometre falls 0.7–1.4%, with operating profit rising 36–73% at a 2% operating margin.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" viewBox="0 0 7 7"><path d="M0 0L7 3.5 0 7Z" fill="#777777"/></marker>
  </defs>
  <rect width="360" height="868" fill="#ffffff"/>
  <text x="16" y="33" font-size="18" font-weight="700" fill="#202020">From efficiency to haulier value</text>
  <text x="16" y="55" font-size="14" fill="#4d4d4d">Normalised long-haul truck · 8 years</text>
  <rect x="16" y="76" width="328" height="72" fill="#f2e3d4"/>
  <text x="30" y="104" font-size="17" font-weight="700" fill="#202020">3% vehicle-efficiency gain</text>
  <text x="30" y="129" font-size="14" fill="#4d4d4d">Energy demand per kilometre falls.</text>
  <path d="M180 149V176" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="16" y="181" width="328" height="151" fill="#eeeeee"/>
  <text x="30" y="208" font-size="16" font-weight="700" fill="#202020">Any truck in service</text>
  <text x="30" y="235" font-size="15" fill="#202020">Electricity: less energy bought per km</text>
  <text x="30" y="260" font-size="15" fill="#202020">Time: shorter charging stops</text>
  <text x="30" y="298" font-size="18" font-weight="700" fill="#202020">1.2× electricity saved</text>
  <path d="M180 333V360" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="16" y="365" width="328" height="181" fill="#d6e3f0"/>
  <text x="30" y="393" font-size="16" font-weight="700" fill="#1f4f78">When specifying a new truck</text>
  <text x="30" y="423" font-size="15" fill="#202020">Battery: smaller, cheaper pack</text>
  <text x="30" y="449" font-size="15" fill="#202020">Payload: saved mass carries freight</text>
  <text x="30" y="477" font-size="14" fill="#4d4d4d">Only captured before the truck is specified.</text>
  <text x="30" y="521" font-size="18" font-weight="700" fill="#1f4f78">1.8–2.5× electricity saved</text>
  <path d="M180 547V574" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="16" y="580" width="328" height="106" fill="#eeeeee"/>
  <text x="30" y="608" font-size="16" font-weight="700" fill="#202020">Cost per tonne-km</text>
  <text x="30" y="637" font-size="20" font-weight="700" fill="#202020">−0.7 to −1.4%</text>
  <text x="30" y="665" font-size="14" fill="#4d4d4d">Energy is about one-fifth of truck cost.</text>
  <path d="M180 687V716" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="16" y="721" width="328" height="119" fill="#eeeeee"/>
  <text x="30" y="750" font-size="16" font-weight="700" fill="#202020">Operating profit, ROI and NPV</text>
  <text x="30" y="782" font-size="20" font-weight="700" fill="#202020">Profit +36 to +73%</text>
  <text x="30" y="812" font-size="14" fill="#4d4d4d">A 2% operating margin amplifies the gain.</text>
  <text x="344" y="857" text-anchor="end" font-size="11" fill="#999999">carlosjorques.com</text>
</svg>
