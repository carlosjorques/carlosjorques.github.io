<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="520" viewBox="0 0 1050 520" font-family="Calibri, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4d4d4d"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98c2b"/></marker>
  </defs>
  <rect width="1050" height="520" fill="#ffffff"/>
  <g font-size="16px" font-weight="bold" fill="#1a1a1a" text-anchor="middle">
    <text x="175" y="32">Software levers</text>
    <text x="440" y="32">Battery sizing</text>
    <text x="665" y="32">Value channels</text>
    <text x="915" y="32">Value over the life</text>
  </g>
  <rect x="30" y="50" width="290" height="44" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="44" y="77" font-size="14px" font-weight="bold" fill="#1a1a1a">Average gain</text>
  <text x="306" y="69" text-anchor="end" font-size="14px" font-weight="bold" fill="#1a1a1a">1.8–2.5×</text>
  <text x="306" y="86" text-anchor="end" font-size="12.5px" fill="#4d4d4d">12,200–16,300 €</text>
  <rect x="30" y="112" width="290" height="44" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="44" y="139" font-size="14px" font-weight="bold" fill="#1a1a1a">Worst-case gain</text>
  <text x="306" y="131" text-anchor="end" font-size="14px" font-weight="bold" fill="#1a1a1a">+0.3–0.6×</text>
  <text x="306" y="148" text-anchor="end" font-size="12.5px" fill="#4d4d4d">+2,100–4,200 €</text>
  <rect x="30" y="166" width="290" height="44" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="44" y="193" font-size="14px" font-weight="bold" fill="#1a1a1a">Slower ageing</text>
  <text x="306" y="185" text-anchor="end" font-size="14px" font-weight="bold" fill="#1a1a1a">+0.4×</text>
  <text x="306" y="202" text-anchor="end" font-size="12.5px" fill="#4d4d4d">+2,700 €</text>
  <rect x="30" y="220" width="290" height="44" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="44" y="247" font-size="14px" font-weight="bold" fill="#1a1a1a">Sizing for the end of life</text>
  <text x="306" y="239" text-anchor="end" font-size="14px" font-weight="bold" fill="#1a1a1a">+0.3–0.7×</text>
  <text x="306" y="256" text-anchor="end" font-size="12.5px" fill="#4d4d4d">+2,300–4,700 €</text>
  <rect x="30" y="274" width="290" height="44" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="44" y="301" font-size="14px" font-weight="bold" fill="#1a1a1a">Thermal operating limits</text>
  <text x="306" y="301" text-anchor="end" font-size="12.5px" font-style="italic" fill="#4d4d4d">not included</text>
  <rect x="30" y="372" width="290" height="44" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="44" y="399" font-size="14px" font-weight="bold" fill="#1a1a1a">Preconditioning</text>
  <text x="306" y="391" text-anchor="end" font-size="14px" font-weight="bold" fill="#1a1a1a">+0.15×</text>
  <text x="306" y="408" text-anchor="end" font-size="12.5px" fill="#4d4d4d">+1,000 €</text>
  <rect x="30" y="434" width="290" height="44" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="44" y="461" font-size="14px" font-weight="bold" fill="#1a1a1a">Thermal hardware downsizing</text>
  <text x="306" y="453" text-anchor="end" font-size="14px" font-weight="bold" fill="#1a1a1a">+0.15×</text>
  <text x="306" y="470" text-anchor="end" font-size="12.5px" fill="#4d4d4d">+1,000 €</text>
  <rect x="350" y="112" width="180" height="206" fill="#eeeeee"/>
  <g text-anchor="middle" fill="#1a1a1a">
    <text x="440" y="138" font-size="14px" font-weight="bold">Same worst-case range</text>
    <text x="440" y="156" font-size="12.5px">at the end of life</text>
    <path d="M454,204 A16,16 0 1 1 440,186" fill="none" stroke="#4d4d4d" stroke-width="2" marker-end="url(#ak)"/>
    <text x="440" y="244" font-size="12.5px" fill="#4d4d4d">iterated: smaller battery,</text>
    <text x="440" y="260" font-size="12.5px" fill="#4d4d4d">lighter truck,</text>
    <text x="440" y="276" font-size="12.5px" fill="#4d4d4d">lower consumption</text>
    <text x="440" y="302" font-size="12.5px" fill="#1a1a1a"><tspan font-weight="bold">+0.05–0.08×</tspan><tspan fill="#4d4d4d">  +300–500 €</tspan></text>
  </g>
  <g stroke="#4d4d4d" stroke-width="1.5" fill="none" marker-end="url(#ak)">
    <line x1="320" y1="72" x2="558" y2="72"/>
    <line x1="320" y1="134" x2="348" y2="134"/>
    <line x1="320" y1="188" x2="348" y2="188"/>
    <line x1="320" y1="242" x2="348" y2="242"/>
    <line x1="320" y1="296" x2="348" y2="296"/>
    <line x1="320" y1="394" x2="558" y2="394"/>
    <line x1="320" y1="456" x2="558" y2="456"/>
    <line x1="530" y1="180" x2="558" y2="180"/>
    <line x1="530" y1="262" x2="558" y2="262"/>
  </g>
  <g fill="#eeeeee">
    <rect x="560" y="50" width="210" height="44"/>
    <rect x="560" y="158" width="210" height="44"/>
    <rect x="560" y="240" width="210" height="44"/>
    <rect x="560" y="372" width="210" height="44"/>
    <rect x="560" y="434" width="210" height="44"/>
  </g>
  <g text-anchor="middle" fill="#1a1a1a">
    <text x="665" y="68" font-size="14px" font-weight="bold">Electricity</text>
    <text x="665" y="86" font-size="12.5px" fill="#4d4d4d">less energy bought per km</text>
    <text x="665" y="176" font-size="14px" font-weight="bold">Battery</text>
    <text x="665" y="194" font-size="12.5px" fill="#4d4d4d">smaller pack, resale value</text>
    <text x="665" y="258" font-size="14px" font-weight="bold">Payload or range</text>
    <text x="665" y="276" font-size="12.5px" fill="#4d4d4d">saved mass becomes freight</text>
    <text x="665" y="390" font-size="14px" font-weight="bold">Time</text>
    <text x="665" y="408" font-size="12.5px" fill="#4d4d4d">shorter charging stops</text>
    <text x="665" y="452" font-size="14px" font-weight="bold">Thermal hardware</text>
    <text x="665" y="470" font-size="12.5px" fill="#4d4d4d">smaller heater, compressor</text>
  </g>
  <g stroke="#4d4d4d" stroke-width="1.5" marker-end="url(#ak)">
    <line x1="770" y1="72" x2="808" y2="72"/>
    <line x1="770" y1="180" x2="808" y2="180"/>
    <line x1="770" y1="262" x2="808" y2="262"/>
    <line x1="770" y1="394" x2="808" y2="394"/>
    <line x1="770" y1="456" x2="808" y2="456"/>
  </g>
  <rect x="810" y="50" width="210" height="428" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="915" y="78" font-size="12.5px" fill="#4d4d4d">per long-haul truck</text>
    <text x="915" y="94" font-size="12.5px" fill="#4d4d4d">over 8 years</text>
    <rect x="826" y="130" width="178" height="110" fill="#d6e3f0"/>
    <text x="915" y="156" font-size="14px" font-weight="bold" fill="#1a1a1a">Average gain only</text>
    <text x="915" y="186" font-size="16px" font-weight="bold" fill="#1f4f78">1.8–2.5×</text>
    <text x="915" y="204" font-size="12.5px" fill="#1a1a1a">the electricity saved</text>
    <text x="915" y="226" font-size="12.5px" fill="#4d4d4d">12,200–16,300 €</text>
    <rect x="826" y="290" width="178" height="110" fill="#f2e3d4"/>
    <text x="915" y="316" font-size="14px" font-weight="bold" fill="#1a1a1a">All levers designed in</text>
    <text x="915" y="346" font-size="16px" font-weight="bold" fill="#b36b12">3.3–4.6×</text>
    <text x="915" y="364" font-size="12.5px" fill="#1a1a1a">the electricity saved</text>
    <text x="915" y="386" font-size="12.5px" fill="#4d4d4d">21,600–30,500 €</text>
  </g>
  <text x="1030" y="510" text-anchor="end" font-size="11px" font-weight="bold" fill="#999999">carlosjorques.com</text>
</svg>
