<svg xmlns="http://www.w3.org/2000/svg" width="360" height="535" viewBox="0 0 360 535" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Lithium-ion cell temperature window</title>
  <desc id="description">Temperature from −30 to 50 °C. Below 15 °C, power and charging power are reduced and heating is needed, especially for LFP. From 15 to 35 °C is the preferred operating window. Above 35 °C, cooling is needed during fast charging and ageing is faster. Qualitative illustration.</desc>
  <defs>
    <linearGradient id="cold"><stop stop-color="#bcd1e5"/><stop offset="1" stop-color="#eeeeee"/></linearGradient>
    <linearGradient id="hot"><stop stop-color="#eeeeee"/><stop offset="1" stop-color="#eec59a"/></linearGradient>
  </defs>
  <rect width="360" height="535" fill="#ffffff"/>
  <g fill="#202020">
    <text x="16" y="33" font-size="18" font-weight="700">Cell temperature and operation</text>
    <text x="16" y="56" font-size="14" fill="#4d4d4d">Qualitative lithium-ion operating window</text>
  </g>
  <rect x="30" y="99" width="169" height="57" fill="url(#cold)"/>
  <rect x="199" y="99" width="75" height="57" fill="#eeeeee"/>
  <rect x="274" y="99" width="56" height="57" fill="url(#hot)"/>
  <path d="M199 96V171M274 96V171" stroke="#777777" stroke-width="1.5"/>
  <path d="M30 172H330" stroke="#777777" stroke-width="1"/>
  <g fill="#4d4d4d" font-size="11.5" text-anchor="middle">
    <text x="30" y="195">−30</text><text x="67.5" y="195">−20</text>
    <text x="105" y="195">−10</text><text x="142.5" y="195">0</text>
    <text x="180" y="195">10</text><text x="217.5" y="195">20</text>
    <text x="255" y="195">30</text><text x="292.5" y="195">40</text>
    <text x="330" y="195">50</text>
  </g>
  <g fill="#202020" font-size="14">
    <text x="16" y="222">Cell temperature (°C)</text>
    <text x="16" y="271" font-weight="700">Below 15 °C · cold</text>
    <text x="16" y="299">Reduced power and charging power.</text>
    <text x="16" y="322">Heating needed; LFP most affected.</text>
    <text x="16" y="369" font-weight="700">15–35 °C · preferred window</text>
    <text x="16" y="416" font-weight="700">Above 35 °C · hot</text>
    <text x="16" y="444">Cooling needed during fast charging.</text>
    <text x="16" y="467">Faster ageing.</text>
  </g>
  <path d="M16 341H344M16 389H344" stroke="#dddddd"/>
  <text x="344" y="522" text-anchor="end" font-size="11" fill="#999999">carlosjorques.com</text>
</svg>
