<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="580" viewBox="0 0 1050 580" font-family="Calibri, Arial, Helvetica, sans-serif">
  <!-- DRAFT: Part 4, Figure 1. Thermal control software in the V model of vehicle development. -->
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d4d4d"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4f78"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98c2b"/></marker>
  </defs>
  <rect width="1050" height="580" fill="#ffffff"/>

  <!-- Branch labels -->
  <text x="30" y="14" font-size="12.5px" font-style="italic" fill="#4d4d4d">Specification and design</text>
  <text x="1020" y="14" font-size="12.5px" font-style="italic" fill="#4d4d4d" text-anchor="end">Integration and verification</text>

  <g text-anchor="middle" fill="#1a1a1a">
    <!-- Left branch -->
    <rect x="30" y="20" width="220" height="60" fill="#eeeeee"/>
    <text x="140" y="45" font-size="14px" font-weight="bold">Vehicle requirements</text>
    <text x="140" y="65" font-size="12.5px" fill="#4d4d4d">route, payload, climate, service life</text>

    <rect x="115" y="105" width="220" height="60" fill="#eeeeee"/>
    <text x="225" y="130" font-size="14px" font-weight="bold">System design and sizing</text>
    <text x="225" y="150" font-size="12.5px" fill="#4d4d4d">battery, thermal hardware, charging</text>

    <rect x="200" y="190" width="220" height="60" fill="#eeeeee"/>
    <text x="310" y="215" font-size="14px" font-weight="bold">Thermal system design</text>
    <text x="310" y="235" font-size="12.5px" fill="#4d4d4d">circuits, components, modes</text>

    <rect x="285" y="275" width="220" height="60" fill="#f2e3d4"/>
    <text x="395" y="300" font-size="14px" font-weight="bold">Control software design</text>
    <text x="395" y="320" font-size="12.5px" fill="#4d4d4d">strategies, models, functions</text>

    <!-- Bottom of the V -->
    <rect x="415" y="360" width="220" height="60" fill="#eeeeee"/>
    <text x="525" y="385" font-size="14px" font-weight="bold">Implementation</text>
    <text x="525" y="405" font-size="12.5px" fill="#4d4d4d">code, control unit integration</text>

    <!-- Right branch -->
    <rect x="545" y="275" width="220" height="60" fill="#eeeeee"/>
    <text x="655" y="300" font-size="14px" font-weight="bold">Software verification</text>
    <text x="655" y="320" font-size="12.5px" fill="#4d4d4d">model- and software-in-the-loop</text>

    <rect x="630" y="190" width="220" height="60" fill="#eeeeee"/>
    <text x="740" y="215" font-size="14px" font-weight="bold">Thermal system integration</text>
    <text x="740" y="235" font-size="12.5px" fill="#4d4d4d">hardware-in-the-loop, test rig</text>

    <rect x="715" y="105" width="220" height="60" fill="#d6e3f0"/>
    <text x="825" y="130" font-size="14px" font-weight="bold">System verification</text>
    <text x="825" y="150" font-size="12.5px" fill="#4d4d4d">vehicle tests, worst-case conditions</text>

    <rect x="800" y="20" width="220" height="60" fill="#eeeeee"/>
    <text x="910" y="45" font-size="14px" font-weight="bold">Vehicle validation</text>
    <text x="910" y="65" font-size="12.5px" fill="#4d4d4d">customer operation, fleet</text>
  </g>

  <!-- V flow -->
  <g stroke="#4d4d4d" stroke-width="1.5" marker-end="url(#ak)">
    <line x1="170" y1="80" x2="195" y2="103"/>
    <line x1="255" y1="165" x2="280" y2="188"/>
    <line x1="340" y1="250" x2="365" y2="273"/>
    <line x1="425" y1="335" x2="450" y2="358"/>
    <line x1="600" y1="358" x2="625" y2="337"/>
    <line x1="685" y1="273" x2="710" y2="252"/>
    <line x1="770" y1="188" x2="795" y2="167"/>
    <line x1="855" y1="103" x2="880" y2="82"/>
  </g>

  <!-- Today: performance first measured on the vehicle, after sizing -->
  <text x="525" y="122" font-size="14px" font-weight="bold" fill="#1f4f78" text-anchor="middle">Today</text>
  <text x="525" y="140" font-size="12.5px" fill="#1f4f78" text-anchor="middle">control performance first measured</text>
  <text x="525" y="156" font-size="12.5px" fill="#1f4f78" text-anchor="middle">here, after the hardware is sized</text>
  <line x1="640" y1="135" x2="710" y2="135" stroke="#1f4f78" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ab)"/>

  <!-- Designed in: worst-case performance from models feeds the sizing -->
  <path d="M440,275 C455,225 420,180 340,158" fill="none" stroke="#d98c2b" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="458" y="200" font-size="14px" font-weight="bold" fill="#b36b12">Designed in</text>
  <text x="458" y="218" font-size="12.5px" fill="#b36b12">worst-case control performance,</text>
  <text x="458" y="234" font-size="12.5px" fill="#b36b12">predicted with models and</text>
  <text x="458" y="250" font-size="12.5px" fill="#b36b12">simulation, as a sizing input</text>

  <!-- Value comparison, per long-haul truck over 8 years, 3% average gain -->
  <rect x="30" y="442" width="480" height="104" fill="#d6e3f0"/>
  <text x="48" y="466" font-size="14px" font-weight="bold" fill="#1a1a1a">Today: software added after the sizing</text>
  <text x="48" y="486" font-size="12.5px" fill="#4d4d4d">Battery and thermal hardware sized with conventional control;</text>
  <text x="48" y="503" font-size="12.5px" fill="#4d4d4d">the software is credited for its average gain only.</text>
  <text x="48" y="532" font-size="12.5px" fill="#1a1a1a"><tspan font-size="16px" font-weight="bold" fill="#1f4f78">1.8–2.5×</tspan> the electricity saved</text>
  <text x="492" y="532" font-size="14px" fill="#4d4d4d" text-anchor="end">€12,200–16,300 per truck</text>

  <rect x="540" y="442" width="480" height="104" fill="#f2e3d4"/>
  <text x="558" y="466" font-size="14px" font-weight="bold" fill="#1a1a1a">Designed in: software as a sizing input</text>
  <text x="558" y="486" font-size="12.5px" fill="#4d4d4d">Smaller battery, end-of-life margin, faster charging and smaller</text>
  <text x="558" y="503" font-size="12.5px" fill="#4d4d4d">thermal hardware, with the same software.</text>
  <text x="558" y="532" font-size="12.5px" fill="#1a1a1a"><tspan font-size="16px" font-weight="bold" fill="#b36b12">3.3–4.6×</tspan> the electricity saved</text>
  <text x="1002" y="532" font-size="14px" fill="#4d4d4d" text-anchor="end">€21,600–30,500 per truck</text>

  <!-- Watermark -->
  <text x="1030" y="570" text-anchor="end" font-size="11px" font-weight="bold" fill="#999999">carlosjorques.com</text>
</svg>
