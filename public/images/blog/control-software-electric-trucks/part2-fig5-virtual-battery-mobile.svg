<title id="title">Battery capacity avoided with and without mass feedback</title>
<desc id="description">For a 640 kWh battery, battery capacity avoided rises with efficiency improvement from zero to five percent. At 2, 3 and 4 percent, mass feedback at sensitivity 0.5 gives 13.4, 19.9 and 26.2 kWh, respectively. A blue band covers sensitivity 0.4 to 0.65. The dashed no-feedback line is slightly lower.</desc>
