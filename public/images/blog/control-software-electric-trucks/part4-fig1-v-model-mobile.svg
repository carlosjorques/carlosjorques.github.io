<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" font-family="Calibri, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#4d4d4d"/>
    </marker>
    <marker id="up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#895000"/>
    </marker>
  </defs>
  <rect width="360" height="760" fill="#ffffff"/>
  <text x="16" y="34" font-size="18" font-weight="bold" fill="#1a1a1a">When is control performance known?</text>
  <text x="16" y="59" font-size="15" fill="#4d4d4d">Specification first; vehicle verification later.</text>

  <rect x="16" y="82" width="328" height="84" fill="#eeeeee"/>
  <text x="30" y="110" font-size="18" font-weight="bold" fill="#1a1a1a">Vehicle requirements</text>
  <text x="30" y="136" font-size="16" fill="#4d4d4d">Route, load, climate and service life</text>
  <path d="M180 169v19" stroke="#4d4d4d" stroke-width="2" marker-end="url(#down)"/>
  <rect x="16" y="194" width="328" height="90" fill="#eeeeee"/>
  <text x="30" y="222" font-size="18" font-weight="bold" fill="#1a1a1a">System sizing</text>
  <text x="30" y="248" font-size="16" fill="#4d4d4d">Battery, thermal hardware, charging</text>
  <text x="30" y="270" font-size="15" fill="#4d4d4d">Hardware specification is fixed here.</text>
  <path d="M180 287v21" stroke="#4d4d4d" stroke-width="2" marker-end="url(#down)"/>

  <rect x="16" y="315" width="328" height="98" fill="#f2e3d4"/>
  <text x="30" y="343" font-size="18" font-weight="bold" fill="#1a1a1a">Predict performance early</text>
  <text x="30" y="369" font-size="16" fill="#4d4d4d">Model the worst-case control gain,</text>
  <text x="30" y="391" font-size="16" fill="#4d4d4d">with evidence for the sizing decision.</text>
  <path d="M332 309v-28" stroke="#895000" stroke-width="2" marker-end="url(#up)"/>
  <text x="213" y="304" font-size="15" fill="#895000">Feeds sizing</text>

  <path d="M180 416v22" stroke="#4d4d4d" stroke-width="2" marker-end="url(#down)"/>
  <rect x="16" y="445" width="328" height="76" fill="#eeeeee"/>
  <text x="30" y="473" font-size="18" font-weight="bold" fill="#1a1a1a">Verify on the vehicle</text>
  <text x="30" y="499" font-size="16" fill="#4d4d4d">Test the control gain after integration.</text>

  <rect x="16" y="539" width="328" height="78" fill="#d6e3f0"/>
  <text x="30" y="566" font-size="17" font-weight="bold" fill="#1f4f78">Gain known too late: battery kept</text>
  <text x="30" y="597" font-size="20" font-weight="bold" fill="#1f4f78">A: 8,140 €</text>
  <rect x="16" y="632" width="328" height="106" fill="#f2e3d4"/>
  <text x="30" y="660" font-size="17" font-weight="bold" fill="#895000">Gain used before hardware is fixed</text>
  <text x="30" y="685" font-size="15" fill="#4d4d4d">Average-gain sizing B/C: 12,200–16,300 €</text>
  <text x="30" y="715" font-size="19" font-weight="bold" fill="#895000">Fully designed in: 21,600–30,500 €</text>
  <text x="344" y="754" font-size="11" font-weight="bold" fill="#999999" text-anchor="end">carlosjorques.com</text>
</svg>
