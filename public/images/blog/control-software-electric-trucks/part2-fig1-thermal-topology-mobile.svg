<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1480" viewBox="0 0 360 1480" role="img" aria-labelledby="title description">
  <title id="title">Electric-truck thermal circuits, mobile overview</title>
  <desc id="description">Six stacked circuit loops show cab air-conditioning refrigerant, cab coolant, heat-pump refrigerant, battery coolant, power-electronics coolant and motor oil. A shared front-end fan serves four air heat exchangers. Matching letters identify the liquid-cooled condenser, chiller and oil cooler that couple circuits. Valves select radiator, bypass and inter-circuit paths. This overview omits the valve-level pipe routing of the full desktop schematic.</desc>
  <defs>
    <marker id="air-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5 1 9" fill="none" stroke="#595959" stroke-width="1.7"/></marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5 1 9" fill="none" stroke="#7e3fa6" stroke-width="1.7"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5 1 9" fill="none" stroke="#b36100" stroke-width="1.7"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5 1 9" fill="none" stroke="#28702b" stroke-width="1.7"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5 1 9" fill="none" stroke="#2f6fb3" stroke-width="1.7"/></marker>
    <marker id="brown-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5 1 9" fill="none" stroke="#82501e" stroke-width="1.7"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #202020; }
      .heading { font-size: 19px; font-weight: 700; }
      .sub { font-size: 14px; fill: #555555; }
      .panel { fill: #f8f8f8; }
      .panel-title { font-size: 16px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 600; }
      .note { font-size: 13px; fill: #555555; }
      .node { fill: #ffffff; }
      .port { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .purple { stroke: #7e3fa6; stroke-width: 2.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#purple-arrow); }
      .orange { stroke: #b36100; stroke-width: 2.5; fill: none; marker-end: url(#orange-arrow); }
      .green { stroke: #28702b; stroke-width: 2.5; fill: none; marker-end: url(#green-arrow); }
      .blue { stroke: #2f6fb3; stroke-width: 2.5; fill: none; marker-end: url(#blue-arrow); }
      .brown { stroke: #82501e; stroke-width: 2.5; fill: none; marker-end: url(#brown-arrow); }
    </style>
  </defs>
