<svg xmlns="http://www.w3.org/2000/svg" width="360" height="642" viewBox="0 0 360 642" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Winter energy and range penalties in different vehicles</title>
  <desc id="description">Finnish city bus: 40–45% more energy in winter versus summer, measured. Passenger car with heating in the cold: 40% range loss, tested. Regional truck in Germany: 25% more energy at 0 °C versus 20 °C, measured. Drayage truck in a mild climate: 3–10% more energy in winter versus summer, simulated. These different measures and conditions are not directly comparable.</desc>
  <rect width="360" height="642" fill="#ffffff"/>
  <text x="16" y="33" font-size="18" font-weight="700" fill="#202020">The winter penalty varies by use</text>
  <text x="16" y="57" font-size="14" fill="#4d4d4d">Extra energy or range loss (%), by study</text>
  <g stroke="#e0e0e0"><path d="M25 92V563M68 92V563M111 92V563M154 92V563M197 92V563M240 92V563M283 92V563M326 92V563"/></g>
  <g fill="#202020" font-size="15" font-weight="700">
    <text x="25" y="119">Finnish city bus · measured</text>
    <text x="25" y="239">Passenger car · tested</text>
    <text x="25" y="359">Regional truck, Germany · measured</text>
    <text x="25" y="479">Drayage truck, mild climate · simulated</text>
  </g>
  <g fill="#4d4d4d" font-size="14">
    <text x="25" y="148">Winter vs summer consumption</text>
    <text x="25" y="268">Cold with heating: range loss</text>
    <text x="25" y="388">0 °C vs 20 °C consumption</text>
    <text x="25" y="508">Winter vs summer consumption</text>
  </g>
  <g fill="#1f4f78">
    <rect x="197" y="168" width="22" height="18" opacity=".66"/>
    <circle cx="197" cy="288" r="7"/>
    <circle cx="133" cy="408" r="7"/>
    <rect x="38" y="528" width="30" height="18" opacity=".66"/>
  </g>
  <g fill="#202020" font-size="15">
    <text x="228" y="184">40–45%</text>
    <text x="211" y="294">40%</text>
    <text x="147" y="414">25%</text>
    <text x="78" y="544">3–10%</text>
  </g>
  <g fill="#4d4d4d" font-size="12" text-anchor="middle">
    <text x="25" y="585">0</text><text x="68" y="585">10</text>
    <text x="111" y="585">20</text><text x="154" y="585">30</text>
    <text x="197" y="585">40</text><text x="240" y="585">50</text>
    <text x="283" y="585">60</text><text x="326" y="585">70</text>
  </g>
  <text x="344" y="630" text-anchor="end" font-size="11" fill="#999999">carlosjorques.com</text>
</svg>
