<svg xmlns="http://www.w3.org/2000/svg" width="360" height="960" viewBox="0 0 360 960" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif" fill="#202020"><title id="title">Cumulative design-lever value per long-haul truck</title><desc id="description">The 3% gain starts at approximately 12,200 euros for mixed freight or 16,300 euros for heavy freight; six further levers add the amounts shown step by step. Battery capacity saved grows from 19 to 40 kWh. With all levers designed in the exact reference-case totals are 21,619 and 30,454 euros, or 3.3 and 4.6 times the electricity saved.</desc><rect width="360" height="960" fill="#ffffff"/><text x="16" y="33" font-size="18" font-weight="700">Further design levers add value</text><text x="16" y="57" font-size="14" fill="#4d4d4d">3% average gain · long-haul · 8 years</text><text x="16" y="81" font-size="13" fill="#4d4d4d">Each row adds one lever to the rows above.</text><rect x="16" y="103" width="328" height="37" fill="#f5f5f5"/><text x="31" y="127" font-size="15" font-weight="700" fill="#1f4f78">Mixed freight</text><text x="195" y="127" font-size="15" font-weight="700" fill="#895000">Heavy freight</text><rect x="16" y="149" width="328" height="88" fill="#f5f5f5"/><text x="29" y="171" font-size="15" font-weight="700" fill="#202020">Gain only (Part 3)</text><text x="30" y="202" font-size="17" font-weight="700" fill="#1f4f78">12,200 €</text><text x="197" y="202" font-size="17" font-weight="700" fill="#895000">16,300 €</text><text x="29" y="226" font-size="13" fill="#4d4d4d">Battery capacity saved: −19 kWh</text><rect x="16" y="246" width="328" height="88" fill="#f5f5f5"/><text x="29" y="268" font-size="15" font-weight="700" fill="#202020">+ Mass feedback</text><text x="30" y="299" font-size="17" font-weight="700" fill="#1f4f78">+300 €</text><text x="197" y="299" font-size="17" font-weight="700" fill="#895000">+500 €</text><text x="29" y="323" font-size="13" fill="#4d4d4d">Battery capacity saved: −20 kWh</text><rect x="16" y="343" width="328" height="88" fill="#f5f5f5"/><text x="29" y="365" font-size="15" font-weight="700" fill="#202020">+ Worst-case gain (1.5×)</text><text x="30" y="396" font-size="17" font-weight="700" fill="#1f4f78">+2,100 €</text><text x="197" y="396" font-size="17" font-weight="700" fill="#895000">+4,200 €</text><text x="29" y="420" font-size="13" fill="#4d4d4d">Battery capacity saved: −29 kWh</text><rect x="16" y="440" width="328" height="88" fill="#f5f5f5"/><text x="29" y="462" font-size="15" font-weight="700" fill="#202020">+ Slower ageing</text><text x="30" y="493" font-size="17" font-weight="700" fill="#1f4f78">+2,700 €</text><text x="197" y="493" font-size="17" font-weight="700" fill="#895000">+2,700 €</text><text x="29" y="517" font-size="13" fill="#4d4d4d">Battery capacity saved: −29 kWh</text><rect x="16" y="537" width="328" height="88" fill="#f5f5f5"/><text x="29" y="559" font-size="15" font-weight="700" fill="#202020">+ Sized for end of life</text><text x="30" y="590" font-size="17" font-weight="700" fill="#1f4f78">+2,300 €</text><text x="197" y="590" font-size="17" font-weight="700" fill="#895000">+4,700 €</text><text x="29" y="614" font-size="13" fill="#4d4d4d">Battery capacity saved: −40 kWh</text><rect x="16" y="634" width="328" height="88" fill="#f5f5f5"/><text x="29" y="656" font-size="15" font-weight="700" fill="#202020">+ Preconditioning</text><text x="30" y="687" font-size="17" font-weight="700" fill="#1f4f78">+1,000 €</text><text x="197" y="687" font-size="17" font-weight="700" fill="#895000">+1,000 €</text><text x="29" y="711" font-size="13" fill="#4d4d4d">Battery capacity saved: −40 kWh</text><rect x="16" y="731" width="328" height="88" fill="#f5f5f5"/><text x="29" y="753" font-size="15" font-weight="700" fill="#202020">+ Smaller thermal units</text><text x="30" y="784" font-size="17" font-weight="700" fill="#1f4f78">+1,000 €</text><text x="197" y="784" font-size="17" font-weight="700" fill="#895000">+1,000 €</text><text x="29" y="808" font-size="13" fill="#4d4d4d">Battery capacity saved: −40 kWh</text><rect x="16" y="828" width="328" height="62" fill="#f2e3d4"/><text x="30" y="850" font-size="15" font-weight="700">All levers designed in</text><text x="30" y="875" font-size="15" font-weight="700" fill="#1f4f78">21,619 € · 3.3×</text><text x="195" y="875" font-size="15" font-weight="700" fill="#895000">30,454 € · 4.6×</text><text x="16" y="917" font-size="13" fill="#4d4d4d">Reference electricity saved: 6,640 €.</text><text x="344" y="947" text-anchor="end" font-size="11" fill="#999999">carlosjorques.com</text></svg>
