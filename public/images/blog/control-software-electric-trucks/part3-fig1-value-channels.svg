<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="490" viewBox="0 0 1050 490" font-family="Calibri, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4d4d4d"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98c2b"/></marker>
  </defs>
  <rect width="1050" height="490" fill="#ffffff"/>
  <!-- Efficiency gain (software) -->
  <rect x="30" y="185" width="170" height="80" fill="#f2e3d4" stroke="#d98c2b" stroke-width="1.5"/>
  <text x="115" y="220" text-anchor="middle" font-size="14px" font-weight="bold" fill="#1a1a1a">Efficiency gain</text>
  <text x="115" y="240" text-anchor="middle" font-size="12.5px" fill="#4d4d4d">2–4% of the vehicle energy</text>

  <!-- Broad arrow: the gain spreads over the channels -->
  <path d="M204,195 L262,30 L262,420 L204,255 Z" fill="#dddddd"/>

  <!-- Groups (background only) -->
  <rect x="270" y="20" width="250" height="200" fill="#f2f2f2"/>
  <text x="395" y="42" text-anchor="middle" font-size="12.5px" font-style="italic" fill="#4d4d4d">In service: any truck (scenario A)</text>
  <rect x="270" y="230" width="250" height="200" fill="#d6e3f0"/>
  <text x="395" y="252" text-anchor="middle" font-size="12.5px" font-style="italic" fill="#1f4f78">At specification: new models (B, C)</text>

  <g fill="#ffffff">
    <rect x="290" y="56" width="210" height="48"/>
    <rect x="290" y="114" width="210" height="48"/>
    <rect x="290" y="266" width="210" height="48"/>
    <rect x="290" y="324" width="210" height="48"/>
  </g>
  <g text-anchor="middle" fill="#1a1a1a">
    <text x="395" y="76" font-size="14px" font-weight="bold">Electricity</text>
    <text x="395" y="94" font-size="12.5px" fill="#4d4d4d">less energy bought per km</text>
    <text x="395" y="134" font-size="14px" font-weight="bold">Time</text>
    <text x="395" y="152" font-size="12.5px" fill="#4d4d4d">shorter charging stops</text>
    <text x="395" y="286" font-size="14px" font-weight="bold">Battery</text>
    <text x="395" y="304" font-size="12.5px" fill="#4d4d4d">smaller, cheaper pack</text>
    <text x="395" y="344" font-size="14px" font-weight="bold">Payload</text>
    <text x="395" y="362" font-size="12.5px" fill="#4d4d4d">saved mass becomes freight</text>
    <text x="395" y="196" font-size="14px" font-weight="bold">1.2×</text>
    <text x="395" y="212" font-size="12.5px" fill="#4d4d4d">the electricity saved</text>
    <text x="395" y="404" font-size="14px" font-weight="bold" fill="#1f4f78">1.8–2.5×</text>
    <text x="395" y="420" font-size="12.5px" fill="#1f4f78">the electricity saved</text>
  </g>

  <!-- Broad arrow: the channels converge on the cost -->
  <path d="M528,30 L586,195 L586,255 L528,420 Z" fill="#dddddd"/>

  <!-- Results -->
  <rect x="590" y="185" width="190" height="80" fill="#eeeeee"/>
  <text x="685" y="211" text-anchor="middle" font-size="14px" font-weight="bold" fill="#1a1a1a">Cost per tonne-km</text>
  <text x="685" y="229" text-anchor="middle" font-size="12.5px" fill="#1a1a1a">and TCO</text>
  <text x="685" y="251" text-anchor="middle" font-size="14px" font-weight="bold" fill="#1a1a1a">−0.5 to −1.9%</text>

  <!-- Block arrow through the thin margin -->
  <path d="M786,212 L816,212 L816,197 L846,225 L816,253 L816,238 L786,238 Z" fill="#dddddd"/>
  <text x="816" y="186" text-anchor="middle" font-size="12.5px" font-style="italic" fill="#4d4d4d">thin margin</text>

  <rect x="850" y="185" width="180" height="80" fill="#eeeeee"/>
  <text x="940" y="211" text-anchor="middle" font-size="14px" font-weight="bold" fill="#1a1a1a">Operating profit</text>
  <text x="940" y="229" text-anchor="middle" font-size="12.5px" fill="#1a1a1a">ROI and NPV</text>
  <text x="940" y="251" text-anchor="middle" font-size="14px" font-weight="bold" fill="#1a1a1a">+24 to +96%</text>

  <!-- Challenges -->
  <g font-size="12.5px" font-style="italic" fill="#4d4d4d" text-anchor="middle">
    <text x="685" y="160">Challenge 1: energy is about 1/5 of the cost</text>
    <text x="395" y="455">Challenge 2: captured only when the truck is specified</text>
    <text x="940" y="290">Challenge 3: 2% operating margin</text>
  </g>
  <text x="1030" y="480" text-anchor="end" font-size="11px" font-weight="bold" fill="#999999">carlosjorques.com</text>
</svg>
