  </g>
  <path d="M125 430c85-1 125-5 156-31 34-28 42-98 82-101 43-3 55 94 98 106 52 15 92-39 143-39 45 0 71 39 108 61 57 34 120-3 145-97 24-88 35-211 93-218 67-7 90 204 136 284" fill="none" stroke="#9a4d4d" stroke-width="7" stroke-linecap="round"/>
