<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Predictive in-cycle combustion control architecture</title>
  <desc id="desc">Block diagram from pressure measurement to virtual sensing, predictive model, controller, and injection correction.</desc>
  <rect width="1200" height="520" fill="#f7f3eb"/>
  <g font-family="Inter, Arial, sans-serif" font-size="24" fill="#26211d">
    <g fill="#fffaf2" stroke="#d8c9b9" stroke-width="3">
      <rect x="80" y="180" width="170" height="120" rx="10"/>
      <rect x="310" y="180" width="170" height="120" rx="10"/>
      <rect x="540" y="180" width="170" height="120" rx="10"/>
      <rect x="770" y="180" width="170" height="120" rx="10"/>
      <rect x="1000" y="180" width="150" height="120" rx="10"/>
    </g>
    <text x="126" y="230" font-weight="700">Pressure</text>
    <text x="111" y="262">measurement</text>
    <text x="356" y="230" font-weight="700">Virtual</text>
    <text x="363" y="262">sensing</text>
    <text x="575" y="230" font-weight="700">Predictive</text>
    <text x="601" y="262">model</text>
    <text x="804" y="230" font-weight="700">Controller</text>
    <text x="804" y="262">correction</text>
    <text x="1030" y="230" font-weight="700">Fuel</text>
    <text x="1020" y="262">injection</text>
  </g>
  <g stroke="#8a5c42" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 240h56"/>
    <path d="M480 240h56"/>
    <path d="M710 240h56"/>
    <path d="M940 240h56"/>
    <path d="M296 228l14 12-14 12M526 228l14 12-14 12M756 228l14 12-14 12M986 228l14 12-14 12"/>
    <path d="M1075 300v70H395v-64"/>
    <path d="M383 324l12-18 12 18"/>
  </g>
  <g font-family="JetBrains Mono, Consolas, monospace" fill="#6b5a4d" font-size="20">
    <text x="96" y="114">same-cycle feedback path</text>
    <text x="770" y="404">prediction error updates model behavior</text>
  </g>
</svg>
