<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Variation reduction with predictive in-cycle control</title>
  <desc id="desc">Before and after plot showing reduced dispersion in combustion behavior.</desc>
  <rect width="1200" height="520" fill="#f7f3eb"/>
  <g transform="translate(90 90)">
    <rect width="450" height="310" rx="10" fill="#fffaf2" stroke="#d8c9b9" stroke-width="3"/>
    <rect x="570" width="450" height="310" rx="10" fill="#fffaf2" stroke="#d8c9b9" stroke-width="3"/>
    <g stroke="#d8c9b9" stroke-width="1">
      <path d="M60 60H390M60 130H390M60 200H390M60 270H390"/>
      <path d="M630 60H960M630 130H960M630 200H960M630 270H960"/>
    </g>
    <g fill="#c66b45" opacity="0.78">
      <circle cx="145" cy="195" r="8"/><circle cx="180" cy="145" r="8"/><circle cx="215" cy="238" r="8"/><circle cx="250" cy="116" r="8"/>
      <circle cx="285" cy="210" r="8"/><circle cx="320" cy="155" r="8"/><circle cx="350" cy="250" r="8"/><circle cx="120" cy="125" r="8"/>
      <circle cx="720" cy="182" r="8"/><circle cx="755" cy="175" r="8"/><circle cx="790" cy="190" r="8"/><circle cx="825" cy="170" r="8"/>
      <circle cx="860" cy="185" r="8"/><circle cx="895" cy="178" r="8"/><circle cx="930" cy="188" r="8"/><circle cx="695" cy="176" r="8"/>
    </g>
    <path d="M100 180c74-80 180-80 290 0" fill="none" stroke="#8a5c42" stroke-width="5" stroke-linecap="round"/>
    <path d="M675 182c84-22 178-22 270 0" fill="none" stroke="#8a5c42" stroke-width="5" stroke-linecap="round"/>
    <g font-family="Inter, Arial, sans-serif" fill="#26211d">
      <text x="70" y="350" font-size="25" font-weight="700">Open loop</text>
      <text x="640" y="350" font-size="25" font-weight="700">Predictive in-cycle control</text>
    </g>
    <g font-family="JetBrains Mono, Consolas, monospace" fill="#6b5a4d" font-size="18">
      <text x="70" y="378">larger stochastic spread</text>
      <text x="640" y="378">reduced cyclic dispersion</text>
    </g>
  </g>
</svg>
